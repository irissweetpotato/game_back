<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rejected Users</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #e5e7eb;
    }
    .page-header {
      background: #111827;
      border-bottom: 1px solid #374151;
      padding: 16px 18px;
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
    }
    h1 {
      font-size: 20px;
      margin: 0;
    }
    .meta {
      color: #9ca3af;
      font-size: 13px;
      margin-top: 4px;
    }
    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }
    .filters {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
      width: 100%;
      margin-top: 12px;
    }
    .filters label {
      color: #9ca3af;
      font-size: 13px;
      font-weight: 700;
    }
    .filters select {
      color: #e5e7eb;
      background: #020617;
      border: 1px solid #334155;
      border-radius: 9px;
      padding: 9px 10px;
      font-size: 14px;
      min-width: 180px;
    }
    .filters button {
      color: #111827;
      background: #e5e7eb;
      border: 0;
      text-decoration: none;
      padding: 9px 12px;
      border-radius: 9px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
    }
    a.button {
      color: #111827;
      background: #e5e7eb;
      text-decoration: none;
      padding: 9px 12px;
      border-radius: 9px;
      font-weight: 700;
      font-size: 14px;
    }
    a.button.secondary {
      color: #e5e7eb;
      background: #374151;
    }
    main {
      padding: 18px;
    }
    .table-wrap {
      overflow: auto;
      max-height: calc(100vh - 180px);
      border: 1px solid #334155;
      border-radius: 12px;
      background: #111827;
    }
    table {
      width: 100%;
      min-width: 1700px;
      border-collapse: separate;
      border-spacing: 0;
      font-size: 13px;
    }
    thead th {
      position: sticky;
      top: 0;
      z-index: 2;
      background: #1f2937;
      color: #f9fafb;
      text-align: left;
      padding: 10px 12px;
      border-bottom: 1px solid #4b5563;
      white-space: nowrap;
    }
    tbody td {
      padding: 9px 12px;
      border-bottom: 1px solid #1f2937;
      vertical-align: middle;
      max-width: none;
      white-space: nowrap;
      overflow: visible;
      text-overflow:clip;
      line-height: 1.35;
    }
    tbody tr:hover {
      background: #172033;
    }
    .empty {
      padding: 24px;
      background: #111827;
      border: 1px solid #334155;
      border-radius: 12px;
      color: #9ca3af;
    }
    .info-btn {
      border: 0;
      border-radius: 8px;
      padding: 7px 10px;
      background: #e5e7eb;
      color: #111827;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }
    .drawer-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 23, .55);
      display: none;
      z-index: 20;
    }
    .drawer {
      position: fixed;
      top: 0;
      right: 0;
      width: min(720px, 100vw);
      height: 100vh;
      background: #020617;
      border-left: 1px solid #334155;
      box-shadow: -24px 0 60px rgba(0,0,0,.35);
      padding: 18px;
      overflow: auto;
      display: none;
      z-index: 21;
    }
    .drawer.open, .drawer-backdrop.open { display: block; }
    .drawer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }
    .drawer h2 { margin: 0; font-size: 18px; }
    .drawer-close {
      border: 0;
      border-radius: 8px;
      padding: 8px 10px;
      background: #374151;
      color: #e5e7eb;
      cursor: pointer;
      font-weight: 700;
    }
    .details-grid {
      display: grid;
      grid-template-columns: 170px minmax(0, 1fr);
      gap: 1px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      overflow: hidden;
    }
    .details-key, .details-value {
      padding: 9px 10px;
      background: #0f172a;
      min-width: 0;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
      line-height: 1.35;
      font-size: 13px;
    }
    .details-key { color: #9ca3af; font-weight: 700; }
  </style>
</head>
<body>
  <header class="page-header">
    <div>
      <h1>Rejected Users</h1>
      <div class="meta">Rows shown: {{ROW_COUNT}} · Generated at: {{GENERATED_AT}}</div>
    </div>
    <nav class="actions">
      <a class="button" href="{{DOWNLOAD_URL}}">Download CSV</a>
      <a class="button secondary" href="{{LOGOUT_URL}}">Log out</a>
    </nav>
    <form class="filters" method="get" action="{{FILTER_ACTION}}">
      <label for="domain">Domain</label>
      <select id="domain" name="domain">
        {{DOMAIN_OPTIONS}}
      </select>

      <label for="order">Reject time</label>
      <select id="order" name="order">
        <option value="desc" {{ORDER_DESC_SELECTED}}>Newest first</option>
        <option value="asc" {{ORDER_ASC_SELECTED}}>Oldest first</option>
      </select>

      <button type="submit">Apply</button>
      <a class="button secondary" href="{{ADMIN_PATH}}">Reset</a>
    </form>
  </header>

  <main>
    {{EMPTY_STATE}}
    <div class="table-wrap" style="{{TABLE_DISPLAY}}">
      <table>
        <thead>
          <tr>{{TABLE_HEADER}}</tr>
        </thead>
        <tbody>
          {{TABLE_ROWS}}
        </tbody>
      </table>
    </div>
  </main>

  <div id="drawerBackdrop" class="drawer-backdrop"></div>
  <aside id="rejectDrawer" class="drawer" aria-hidden="true">
    <div class="drawer-header">
      <h2>Reject information</h2>
      <button type="button" id="drawerClose" class="drawer-close">Close</button>
    </div>
    <div id="drawerContent" class="details-grid"></div>
  </aside>

  <script>
    const drawer = document.getElementById('rejectDrawer');
    const backdrop = document.getElementById('drawerBackdrop');
    const content = document.getElementById('drawerContent');
    const closeBtn = document.getElementById('drawerClose');

    function escapeText(value) {
      return String(value ?? '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
    }

    function openDrawer(row) {
      content.innerHTML = Object.entries(row).map(([key, value]) =>
        `<div class="details-key">${escapeText(key)}</div><div class="details-value">${escapeText(value)}</div>`
      ).join('');
      drawer.classList.add('open');
      backdrop.classList.add('open');
      drawer.setAttribute('aria-hidden', 'false');
    }

    function closeDrawer() {
      drawer.classList.remove('open');
      backdrop.classList.remove('open');
      drawer.setAttribute('aria-hidden', 'true');
    }

    document.addEventListener('click', (event) => {
      const button = event.target.closest('.info-btn');
      if (!button) return;
      try { openDrawer(JSON.parse(button.dataset.row || '{}')); }
      catch { openDrawer({ error: 'Failed to parse row data' }); }
    });

    closeBtn.addEventListener('click', closeDrawer);
    backdrop.addEventListener('click', closeDrawer);
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') closeDrawer();
    });
  </script>
</body>
</html>
